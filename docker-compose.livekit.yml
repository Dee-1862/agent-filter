# Local LiveKit server in dev mode. API key/secret: devkey / secret
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"          # HTTP / WebSocket signalling
      - "7881:7881"          # WebRTC over TCP
      - "7882:7882/udp"      # WebRTC over UDP
